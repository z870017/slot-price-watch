<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スロット實機 跨站比價</title>
<style>
  :root{
    --ink:#161a1d; --ink2:#4b545c; --ink3:#858e97;
    --line:#e4e7ea; --bg:#f7f8f9; --card:#fff;
    --accent:#1f6feb; --accent-soft:#eaf2ff;
    --low:#0f7b56; --low-soft:#e8f7f0;
    --hi:#b91c1c; --warn:#b45309; --warn-soft:#fff8ed;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#e8eaed; --ink2:#b3bac1; --ink3:#8b939b;
      --line:#2b3138; --bg:#14181c; --card:#1b2026;
      --accent:#6ea8ff; --accent-soft:#1c2a3f;
      --low:#4ade80; --low-soft:#14301f;
      --hi:#f87171; --warn:#fbbf24; --warn-soft:#33280f;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.6;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",
      "Hiragino Sans","Microsoft JhengHei",sans-serif;}
  .wrap{max-width:1240px;margin:0 auto;padding:22px 18px 80px}
  header{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;
    border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px}
  h1{font-size:21px;margin:0;letter-spacing:-.01em}
  .updated{font-size:12.5px;color:var(--ink3);margin-top:3px}
  .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);
    padding:8px 14px;border-radius:8px;cursor:pointer;transition:.12s}
  button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  button:disabled{opacity:.5;cursor:default}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.primary:hover:not(:disabled){filter:brightness(1.08);color:#fff}
  .ghost{font-size:12.5px;padding:5px 10px;color:var(--ink3)}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .stat .label{font-size:11.5px;color:var(--ink3);letter-spacing:.03em}
  .stat .value{font-size:20px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
  .stat .value small{font-size:12px;font-weight:400;color:var(--ink3);margin-left:3px}

  .verdict{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;
    padding:11px 15px;margin-bottom:16px;font-size:13.8px}
  .alert{background:var(--warn-soft);border-left:3px solid var(--warn);border-radius:0 8px 8px 0;
    padding:10px 15px;margin-bottom:10px;font-size:13.2px;color:var(--warn)}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  input[type=search],select,input[type=number]{font:inherit;padding:7px 11px;border:1px solid var(--line);
    border-radius:8px;background:var(--card);color:var(--ink)}
  input[type=search]{flex:1;min-width:190px}
  input[type=number]{width:76px}
  label.chk{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink2);cursor:pointer}

  .tablewrap{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{background:var(--bg);font-size:12px;font-weight:600;color:var(--ink2);position:sticky;top:0;
    cursor:pointer;user-select:none;z-index:1}
  th:hover{color:var(--accent)}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--accent-soft)}
  td.name{white-space:normal;min-width:230px;max-width:360px;font-weight:500}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .twd{color:var(--ink3);font-size:11.5px;display:block}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .cell-low{background:var(--low-soft)}
  .cell-low a{color:var(--low);font-weight:650}
  .spread{color:var(--hi);font-weight:650}
  .pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;
    background:var(--accent-soft);color:var(--accent);margin-left:5px}
  .pill.out{background:var(--line);color:var(--ink3)}
  .muted{color:var(--ink3)}
  .empty{padding:44px;text-align:center;color:var(--ink3)}

  #log{font-size:12.5px;color:var(--ink2);margin-top:8px;min-height:19px}
  .spin{display:inline-block;width:11px;height:11px;border:2px solid var(--line);
    border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite;vertical-align:-1px;margin-right:5px}
  @keyframes s{to{transform:rotate(360deg)}}

  dialog{border:1px solid var(--line);border-radius:14px;padding:24px;max-width:460px;width:92%;
    background:var(--card);color:var(--ink)}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  dialog h3{margin:0 0 10px;font-size:16px}
  dialog p{font-size:13.2px;color:var(--ink2);margin:0 0 12px}
  dialog input{width:100%;margin-bottom:10px;font:inherit;padding:8px 11px;
    border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
  dialog ol{font-size:12.8px;color:var(--ink2);padding-left:20px;margin:0 0 14px}
  .row{display:flex;gap:8px;justify-content:flex-end}
  footer{margin-top:26px;font-size:12px;color:var(--ink3);text-align:center}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <h1>スロット實機 跨站比價</h1>
    <div class="updated" id="updated">載入中…</div>
  </div>
  <div class="actions">
    <button class="primary" id="refresh">立即更新</button>
    <button class="ghost" id="settings">設定</button>
  </div>
</header>

<div id="log"></div>
<div id="alerts"></div>
<div class="stats" id="stats"></div>
<div class="verdict" id="verdict" hidden></div>

<div class="toolbar">
  <input type="search" id="q" placeholder="搜尋機種名…（例：からくり、カバネリ）">
  <label class="chk"><input type="checkbox" id="onlyCompare" checked> 只看可比價</label>
  <label class="chk"><input type="checkbox" id="onlyStock" checked> 只看有庫存</label>
  <label class="chk">匯率 <input type="number" id="rate" step="0.001" value="0.21" title="1 日圓 = ? 台幣"></label>
  <span class="muted" id="count"></span>
</div>

<div class="tablewrap">
  <table>
    <thead><tr id="thead"></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="empty" hidden>沒有符合條件的機種</div>
</div>

<footer>資料來自各店家公開商品頁，僅供個人比價參考。實際價格請以店家頁面為準。</footer>
</div>

<dialog id="dlg">
  <h3>連線設定</h3>
  <p>「立即更新」需要呼叫 GitHub API 觸發抓取。Token 只存在你自己的瀏覽器，不會上傳到任何地方。</p>
  <ol>
    <li>到 GitHub → Settings → Developer settings → <b>Fine-grained tokens</b></li>
    <li>Repository access 選這個 repo</li>
    <li>Permissions 只需要 <b>Actions: Read and write</b></li>
  </ol>
  <input id="repoIn" placeholder="owner/repo（例：myname/slot-price-watch）">
  <input id="tokenIn" type="password" placeholder="github_pat_…（留空則改用開啟 Actions 頁面的方式）">
  <div class="row">
    <button id="dlgClear">清除</button>
    <button id="dlgCancel">取消</button>
    <button class="primary" id="dlgSave">儲存</button>
  </div>
</dialog>

<script>
const WORKFLOW = "scrape.yml";
const LS = { token: "spw_token", repo: "spw_repo", rate: "spw_rate" };
const $ = (id) => document.getElementById(id);

let DATA = null, SORT = { key: "spread", dir: -1 };

/* ---------- repo 位置：先看設定，沒有就從 GitHub Pages 網址推斷 ---------- */
function repoSlug() {
  const saved = localStorage.getItem(LS.repo);
  if (saved) return saved;
  const m = location.hostname.match(/^([^.]+)\.github\.io$/);
  if (m) {
    const seg = location.pathname.split("/").filter(Boolean)[0];
    if (seg) return `${m[1]}/${seg}`;
  }
  return null;
}

const yen = (n) => n == null ? "" : "¥" + n.toLocaleString();
const twd = (n) => {
  const r = parseFloat($("rate").value) || 0;
  return (n == null || !r) ? "" : "≈NT$" + Math.round(n * r).toLocaleString();
};
function log(html) { $("log").innerHTML = html; }

/* ---------- 載入資料 ---------- */
async function loadData(preferRaw = false) {
  const slug = repoSlug();
  const bust = "?t=" + Date.now();
  const urls = [];
  // 剛跑完抓取時優先讀 raw：GitHub Pages 的 CDN 有快取延遲，raw 是即時的
  if (preferRaw && slug) urls.push(`https://raw.githubusercontent.com/${slug}/main/docs/data.json${bust}`);
  urls.push("data.json" + bust);
  if (slug) urls.push(`https://raw.githubusercontent.com/${slug}/main/docs/data.json${bust}`);

  for (const url of urls) {
    try {
      const res = await fetch(url, { cache: "no-store" });
      if (res.ok) { DATA = await res.json(); render(); return true; }
    } catch (e) { /* 換下一個來源 */ }
  }
  $("updated").textContent = "尚無資料 — 請先執行一次抓取";
  return false;
}

/* ---------- 畫面 ---------- */
function render() {
  if (!DATA) return;
  const s = DATA.summary, sites = DATA.sites;

  const t = new Date(DATA.generated_at);
  $("updated").innerHTML = `最後更新 ${t.toLocaleString("zh-TW", { hour12: false })}`
    + `　<span class="muted">· run #${DATA.run.id} · ${DATA.run.trigger}</span>`;

  $("stats").innerHTML = [
    ["商品總數", s.total_products, ""],
    ["辨識機種", s.total_models, "台"],
    ["可跨站比價", s.comparable_models, "台"],
    ["價差中位數", yen(s.median_spread_yen), ""],
    ["最大價差", yen(s.max_spread_yen), ""],
    ["本次變動", (DATA.changes || []).length, "筆"],
  ].map(([l, v, u]) =>
    `<div class="stat"><div class="label">${l}</div><div class="value">${v}<small>${u}</small></div></div>`
  ).join("");

  if (s.verdict) { $("verdict").textContent = s.verdict; $("verdict").hidden = false; }

  $("alerts").innerHTML = (DATA.warnings || [])
    .map(w => `<div class="alert">${escapeHtml(w)}</div>`).join("");

  const cols = [
    ["name", "機種"], ["site_count", "站數"],
    ...sites.map(x => [`site_${x.key}`, x.name]),
    ["spread", "價差"], ["spread_pct", "%"],
  ];
  $("thead").innerHTML = cols.map(([k, l]) =>
    `<th data-k="${k}">${l}${SORT.key === k ? (SORT.dir < 0 ? " ↓" : " ↑") : ""}</th>`
  ).join("");
  $("thead").querySelectorAll("th").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    SORT = { key: k, dir: SORT.key === k ? -SORT.dir : -1 };
    render();
  });

  renderRows();
}

function renderRows() {
  const q = $("q").value.trim().toLowerCase();
  const onlyCompare = $("onlyCompare").checked;
  const onlyStock = $("onlyStock").checked;
  const sites = DATA.sites;

  let rows = DATA.items.filter(r => {
    if (onlyCompare && r.site_count < 2) return false;
    if (onlyStock && !r.in_stock) return false;
    if (q && !(r.name + " " + (r.maker || "")).toLowerCase().includes(q)) return false;
    return true;
  });

  const k = SORT.key;
  rows.sort((a, b) => {
    let va, vb;
    if (k.startsWith("site_")) {
      const sk = k.slice(5);
      va = a.sites[sk]?.price ?? Infinity; vb = b.sites[sk]?.price ?? Infinity;
    } else if (k === "name") { va = a.name; vb = b.name; }
    else { va = a[k]; vb = b[k]; }
    if (typeof va === "string") return va.localeCompare(vb) * SORT.dir;
    return (va - vb) * SORT.dir;
  });

  $("count").textContent = `${rows.length} 台`;
  $("empty").hidden = rows.length > 0;

  $("tbody").innerHTML = rows.slice(0, 600).map(r => {
    const cells = sites.map(s => {
      const v = r.sites[s.key];
      if (!v) return `<td class="num muted">—</td>`;
      const isLow = r.site_count > 1 && v.price === r.min_price;
      return `<td class="num ${isLow ? "cell-low" : ""}">`
        + `<a href="${v.url}" target="_blank" rel="noopener" title="${escapeHtml(v.raw_name)}">${yen(v.price)}</a>`
        + (v.sold_out ? `<span class="pill out">售完</span>` : "")
        + `<span class="twd">${twd(v.price)}</span></td>`;
    }).join("");
    return `<tr>
      <td class="name">${escapeHtml(r.name)}${r.spec ? `<span class="pill">${r.spec}</span>` : ""}
        ${r.maker ? `<span class="twd">${escapeHtml(r.maker)}</span>` : ""}</td>
      <td class="num">${r.site_count}</td>
      ${cells}
      <td class="num ${r.spread > 0 ? "spread" : "muted"}">${r.spread ? yen(r.spread) : "—"}
        <span class="twd">${r.spread ? twd(r.spread) : ""}</span></td>
      <td class="num muted">${r.spread_pct ? r.spread_pct + "%" : "—"}</td>
    </tr>`;
  }).join("");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ---------- 立即更新：觸發 GitHub Actions 並輪詢到跑完 ---------- */
async function triggerRefresh() {
  const slug = repoSlug();
  const token = localStorage.getItem(LS.token);

  if (!slug) { openSettings(); return; }
  if (!token) {
    // 沒設 token 也能用：直接開 Actions 頁面讓使用者手動按 Run workflow
    window.open(`https://github.com/${slug}/actions/workflows/${WORKFLOW}`, "_blank");
    log(`已開啟 GitHub Actions 頁面，請按 <b>Run workflow</b>。設定 token 後就能在這裡一鍵觸發。`);
    return;
  }

  const btn = $("refresh");
  btn.disabled = true;
  const api = `https://api.github.com/repos/${slug}`;
  const headers = {
    Authorization: `Bearer ${token}`,
    Accept: "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28",
  };

  try {
    log(`<span class="spin"></span>正在觸發抓取…`);
    const before = await latestRunId(api, headers);

    const res = await fetch(`${api}/actions/workflows/${WORKFLOW}/dispatches`, {
      method: "POST", headers,
      body: JSON.stringify({ ref: "main", inputs: {} }),
    });
    if (!res.ok) throw new Error(`觸發失敗 (HTTP ${res.status})：${(await res.text()).slice(0, 160)}`);

    // 等 GitHub 建立新的 run（dispatch 是非同步的，run 不會立刻出現）
    let runId = null;
    for (let i = 0; i < 20 && !runId; i++) {
      await sleep(3000);
      const id = await latestRunId(api, headers);
      if (id && id !== before) runId = id;
      log(`<span class="spin"></span>已送出，等待 GitHub 建立工作…（${(i + 1) * 3}s）`);
    }
    if (!runId) throw new Error("等不到新的 run，請到 GitHub Actions 頁面確認");

    const runUrl = `https://github.com/${slug}/actions/runs/${runId}`;
    const started = Date.now();
    while (true) {
      await sleep(10000);
      const r = await fetch(`${api}/actions/runs/${runId}`, { headers }).then(x => x.json());
      const mins = Math.floor((Date.now() - started) / 60000);
      const secs = Math.floor((Date.now() - started) / 1000) % 60;
      if (r.status === "completed") {
        if (r.conclusion !== "success")
          throw new Error(`抓取結束但狀態為 ${r.conclusion} — <a href="${runUrl}" target="_blank">查看紀錄</a>`);
        log(`<span class="spin"></span>抓取完成，載入新資料…`);
        await sleep(4000);                 // 等 commit 推上去
        await loadData(true);
        log(`已更新完成（耗時 ${mins} 分 ${secs} 秒）· <a href="${runUrl}" target="_blank">紀錄</a>`);
        break;
      }
      log(`<span class="spin"></span>抓取進行中… ${mins} 分 ${secs} 秒`
        + `（三站全量約需 30–90 分鐘）· <a href="${runUrl}" target="_blank">即時紀錄</a>`);
    }
  } catch (e) {
    log(`<span style="color:var(--hi)">${e.message}</span>`);
  } finally {
    btn.disabled = false;
  }
}

async function latestRunId(api, headers) {
  const r = await fetch(`${api}/actions/workflows/${WORKFLOW}/runs?per_page=1`, { headers });
  if (!r.ok) return null;
  const j = await r.json();
  return j.workflow_runs?.[0]?.id ?? null;
}
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

/* ---------- 設定 ---------- */
function openSettings() {
  $("repoIn").value = localStorage.getItem(LS.repo) || repoSlug() || "";
  $("tokenIn").value = localStorage.getItem(LS.token) || "";
  $("dlg").showModal();
}
$("settings").onclick = openSettings;
$("dlgCancel").onclick = () => $("dlg").close();
$("dlgClear").onclick = () => {
  localStorage.removeItem(LS.token); localStorage.removeItem(LS.repo);
  $("dlg").close(); log("已清除設定");
};
$("dlgSave").onclick = () => {
  const repo = $("repoIn").value.trim(), token = $("tokenIn").value.trim();
  repo ? localStorage.setItem(LS.repo, repo) : localStorage.removeItem(LS.repo);
  token ? localStorage.setItem(LS.token, token) : localStorage.removeItem(LS.token);
  $("dlg").close(); log("設定已儲存");
};

$("refresh").onclick = triggerRefresh;
["q", "onlyCompare", "onlyStock"].forEach(id => $(id).oninput = () => DATA && renderRows());
$("rate").oninput = () => { localStorage.setItem(LS.rate, $("rate").value); DATA && renderRows(); };
$("rate").value = localStorage.getItem(LS.rate) || "0.21";

loadData();
</script>
</body>
</html>
